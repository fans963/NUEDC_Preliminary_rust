[workspace]
members = [
    "pov-baker",
    "pov-core",
]

exclude = ["tools/serve-frontend"]

resolver = "2"

[package]
edition = "2024"
name = "pov-firmware"
version = "0.1.0"

[[bin]]
name = "pov-firmware"
path = "./src/main.rs"
test = false

[lib]
test = false

[dependencies]
# ── ESP HAL ────────────────────────────────────────────────────────────────
esp-hal = { version = "~1.1.0", features = ["defmt", "esp32c5", "unstable"] }
esp-rtos = { version = "0.3.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c5",
] }
esp-radio = { version = "0.18.0", features = [
  "defmt",
  "esp-alloc",
  "esp32c5",
  "unstable",
  "wifi",
] }
esp-alloc = { version = "0.10.0", features = ["esp32c5", "nightly"] }
esp-storage = { version = "0.9.0", features = ["esp32c5", "defmt", "esp-hal"] }
esp-partition-table = { version = "0.1.3", features = ["heapless"] }
esp-backtrace = { version = "0.19.0", features = ["defmt", "esp32c5", "panic-handler"] }
esp-println = { version = "0.17.0", features = ["defmt-espflash", "esp32c5"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["defmt", "esp32c5"] }

# ── Embassy ─────────────────────────────────────────────────────────────────
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embassy-net = { version = "0.9.1", features = [
  "defmt",
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embassy-sync = "0.8.0"
statig = { version = "0.4.1", features = ["macro", "async"] }

# ── Network & Web ──────────────────────────────────────────────────────────
picoserve = { version = "0.18.0", features = ["defmt", "embassy", "alloc"] }
embedded-io = { version = "0.7.1", features = ["defmt"] }
embedded-io-async = { version = "0.7.0", features = ["defmt"] }

# ── Sensor / Math ──────────────────────────────────────────────────────────
embedded-hal = "1.0.0"
uom = { version = "0.38.0", default-features = false, features = [
  "f32",
  "si",
  "autoconvert",
] }

# ── Serialization (postcard) ───────────────────────────────────────────────
postcard = { version = "1.1.3", features = ["defmt", "alloc"] }
serde = { version = "1.0.228", features = ["derive"], default-features = false }

# ── Utility ────────────────────────────────────────────────────────────────
defmt = "1.0.1"
critical-section = "1.2.0"
static_cell = "2.1.1"
heapless = { version = "0.9.3", features = ["defmt", "nightly"] }
rtt-target = { version = "0.6.2", features = ["defmt"] }

# ── Workspace members ──────────────────────────────────────────────────────
pov-core = { path = "pov-core", features = ["serialize"] }

[build-dependencies]
pov-baker = { path = "pov-baker" }

[profile.dev]
opt-level = "s"

[profile.release]
strip = false
codegen-units = 1
lto = "fat"
debug = 0
opt-level = 3
panic = "abort"
incremental = false
overflow-checks = false
