[package]
name = "pov-baker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pov-baker"
path = "src/bin/baker_cli.rs"
required-features = ["cli"]

[[bin]]
name = "baker-gui"
path = "src/bin/baker_gui.rs"
required-features = ["gui"]

[dependencies]
pov-core = { path = "../pov-core", features = ["serialize"] }
postcard = { version = "1.1.3", features = ["alloc"] }
libm = { version = "0.2", default-features = false }

# CLI
clap = { version = "4", features = ["derive"], optional = true }

# Bevy — 几何原语（Cuboid/Sphere/Cylinder 等）+ 可选 GPU 渲染
bevy = { version = "0.18", default-features = false, features = [
    "bevy_render", "bevy_mesh",
], optional = true }

# glTF 文件加载
gltf = { version = "1.4", default-features = false, features = ["utils"], optional = true }

# GUI
bevy_egui = { version = "0.39", optional = true }
ureq = { version = "3", optional = true, features = ["json"] }
tobj = { version = "4", optional = true }
stl_io = { version = "0.7", optional = true }
rfd = { version = "0.15", optional = true }

[features]
default = ["cli"]
cli    = ["dep:clap", "bevy", "gltf", "dep:tobj", "dep:stl_io"]
gui    = ["dep:bevy_egui", "dep:ureq", "dep:tobj", "dep:stl_io", "dep:rfd", "bevy", "gltf", "bevy/default"]
bevy   = ["dep:bevy", "std"]
gltf   = ["dep:gltf", "std"]
std    = []
