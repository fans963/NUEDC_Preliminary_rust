[package]
name = "pov-core"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard = { version = "1.1.3", features = ["alloc"], optional = true }
serde = { version = "1.0.228", features = ["derive"], default-features = false, optional = true }
libm = { version = "0.2", default-features = false }

[features]
default = []
serialize = ["dep:postcard", "dep:serde"]
